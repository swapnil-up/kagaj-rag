name: Ingest Kagaj Datasets

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Run Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger ingestion via Worker
        run: |
          echo "Triggering ingestion..."
          response=$(curl -s -w "\n%{http_code}" -X POST "https://kagaj-rag.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev/api/ingest" \
            -H "Content-Type: application/json" \
            -d '{}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          echo "HTTP $http_code"
          echo "$body" | jq .
          if [ "$http_code" -ne 200 ]; then
            echo "Ingestion failed"
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}